services:
  dayberry:
    build: .
    container_name: dayberry
    restart: unless-stopped
    ports:
      - "3010:80"
    environment:
      DATABASE_URL: file:/app/data/dayberry.db
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-prod}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://routerai.ru/api/v1}
      AI_MODEL: ${AI_MODEL:-qwen/qwen3-vl-30b-a3b-instruct}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-qwen/qwen3-embedding-4b}
    volumes:
      - dayberry-data:/app/data
    networks:
      - npm_network

volumes:
  dayberry-data:

networks:
  npm_network:
    external: true
    name: npm_default
