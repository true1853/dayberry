services:
  dayberry:
    build:
      context: .
      args:
        NEXT_PUBLIC_VK_CLIENT_ID: ${NEXT_PUBLIC_VK_CLIENT_ID:-}
        NEXT_PUBLIC_YANDEX_CLIENT_ID: ${NEXT_PUBLIC_YANDEX_CLIENT_ID:-}
    container_name: dayberry
    restart: unless-stopped
    ports:
      - "3010:80"
    environment:
      DATABASE_URL: file:/app/data/dayberry.db
      # Расширенное чтение состояния эскроу. Включает только значение "1";
      # выключение возвращает прежний ответ сервера и не влияет на
      # исправленное ядро эскроу — оно работает одинаково в обоих режимах.
      DEAL_ESCROW_EXPANDED_READS: ${DEAL_ESCROW_EXPANDED_READS:-0}
      # обязателен: приложение не стартует с пустым или дефолтным секретом.
      # сгенерировать: openssl rand -hex 32
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # кому доступен экран рассылки: список email через запятую
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # внутренние/тестовые аккаунты, которые по умолчанию исключаются из воронки
      ANALYTICS_TEST_EMAILS: ${ANALYTICS_TEST_EMAILS:-}
      # web-push: пара ключей VAPID, публичный уходит в браузер при подписке
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@dayberry.ru}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://routerai.ru/api/v1}
      AI_MODEL: ${AI_MODEL:-qwen/qwen3-vl-30b-a3b-instruct}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-qwen/qwen3-embedding-4b}
      APP_URL: ${APP_URL:-}
      NEXT_PUBLIC_VK_CLIENT_ID: ${NEXT_PUBLIC_VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN:-}
      NEXT_PUBLIC_YANDEX_CLIENT_ID: ${NEXT_PUBLIC_YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    volumes:
      - dayberry-data:/app/data
    networks:
      - npm_network

volumes:
  dayberry-data:

networks:
  npm_network:
    external: true
    name: npm_default
