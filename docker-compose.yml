services:
  dayberry:
    build: .
    container_name: dayberry
    restart: unless-stopped
    ports:
      - "3010:80"
    environment:
      DATABASE_URL: file:/app/data/dayberry.db
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-prod}
    volumes:
      - dayberry-data:/app/data
    networks:
      - npm_network

volumes:
  dayberry-data:

networks:
  npm_network:
    external: true
    name: npm_default
