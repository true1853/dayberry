<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Дайбери — нет соединения</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F8F8FC; color: #17152A; text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .box { max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 19px; margin: 0; }
  p { font-size: 14.5px; line-height: 1.5; color: #5A5670; margin: 0; }
  button {
    margin-top: 6px; border: none; border-radius: 14px; padding: 13px 22px; cursor: pointer;
    background: #4B2BC9; color: #fff; font-size: 15px; font-weight: 600; font-family: inherit;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="/icon-192.png" alt="Дайбери" />
    <h1>Нет соединения</h1>
    <p>Дайбери не может связаться с сервером. Проверьте интернет — обмены, переписки и баллы на месте, они просто ждут сети.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
